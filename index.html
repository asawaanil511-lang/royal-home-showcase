<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Betwic Toss Book - Live Cricket Toss Gaming Arena</title>
    <meta name="description" content="Betwic Toss Book - The original and trusted cricket toss gaming arena. Pick live matches and win virtual rewards." />
    <meta name="author" content="Betwic Toss Book" />

    <meta property="og:title" content="Betwic Toss Book" />
    <meta property="og:description" content="The original and trusted cricket toss gaming arena. Est. 2019." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/jpeg" href="/betwic-logo.jpg" />

    <!-- DNS prefetch + preconnect for Supabase (auth & realtime calls happen immediately) -->
    <link rel="preconnect" href="https://xzgccthebdjchdumgrvv.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://xzgccthebdjchdumgrvv.supabase.co" />
    <!-- Realtime websocket endpoint -->
    <link rel="preconnect" href="wss://xzgccthebdjchdumgrvv.supabase.co" crossorigin />

    <!-- Inline critical styles: show background + spinner instantly before any JS loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#0a0c15}
      #root{height:100%}
      #app-loader{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;background:#0a0c15;
        z-index:9999;transition:opacity .3s ease;
      }
      #app-loader.hidden{opacity:0;pointer-events:none}
      .loader-logo{
        width:56px;height:56px;border-radius:50%;
        background:url('/betwic-logo.jpg') center/cover;
        border:2px solid rgba(0,180,255,.4);
        margin-bottom:20px;
        box-shadow:0 0 24px rgba(0,180,255,.25);
      }
      .loader-ring{
        width:36px;height:36px;border-radius:50%;
        border:3px solid rgba(0,180,255,.15);
        border-top-color:#00b4ff;
        animation:spin .7s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
      .loader-text{
        margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.2em;
        color:rgba(255,255,255,.4);font-family:system-ui,sans-serif;
      }
    </style>
  </head>

  <body>
    <!-- Visible the instant the HTML arrives — before any JS or CSS bundle loads -->
    <div id="app-loader">
      <div class="loader-logo"></div>
      <div class="loader-ring"></div>
      <div class="loader-text">BETWIC TOSS BOOK</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide the loader once React has mounted -->
    <script>
      window.__hideLoader=function(){
        var el=document.getElementById('app-loader');
        if(el){el.classList.add('hidden');setTimeout(function(){el.remove()},350);}
      };
    </script>
  </body>
</html>
