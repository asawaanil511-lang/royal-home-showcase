<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RS Toss Book - Live Cricket Toss Gaming Arena</title>
    <meta name="description" content="RS Toss Book - The original and trusted cricket toss gaming arena. Pick live matches and win virtual rewards." />
    <meta name="author" content="RS Toss Book" />

    <meta property="og:title" content="RS Toss Book" />
    <meta property="og:description" content="The original and trusted cricket toss gaming arena. Est. 2019." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/jpeg" href="/rs-toss-logo.jpg" />

    <!-- Anti-flash: reads saved theme from localStorage and sets class BEFORE any paint -->
    <script>
      (function(){try{var t=localStorage.getItem('stb_theme');document.documentElement.className=t==='dark'?'dark':'light';}catch(e){document.documentElement.className='light';}})();
    </script>

    <!-- DNS/preconnect for Supabase -->
    <link rel="preconnect" href="https://xzgccthebdjchdumgrvv.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://xzgccthebdjchdumgrvv.supabase.co" />
    <link rel="preconnect" href="wss://xzgccthebdjchdumgrvv.supabase.co" crossorigin />

    <!-- Google Fonts as <link> (faster than CSS @import — parallel download, non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />

    <!-- Critical inline styles: theme-aware loader visible before JS/CSS arrive -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%}
      #root{height:100%}
      html.dark body{background:#0a0c15}
      html.light body{background:#f0f7f8}
      #app-loader{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        z-index:9999;transition:opacity .3s ease;
      }
      html.dark  #app-loader{background:#0a0c15}
      html.light #app-loader{background:#f0f7f8}
      .loader-logo{
        width:56px;height:56px;border-radius:50%;
        background:url('/rs-toss-logo.jpg') center/cover;
        margin-bottom:20px;
      }
      html.dark  .loader-logo{border:2px solid rgba(0,180,255,.4);box-shadow:0 0 24px rgba(0,180,255,.25)}
      html.light .loader-logo{border:2px solid rgba(0,130,160,.4);box-shadow:0 0 18px rgba(0,130,160,.2)}
      .loader-ring{
        width:36px;height:36px;border-radius:50%;
        border-top-color:transparent;
        animation:spin .7s linear infinite;
      }
      html.dark  .loader-ring{border:3px solid rgba(0,180,255,.15);border-top-color:#00b4ff}
      html.light .loader-ring{border:3px solid rgba(0,130,160,.2);border-top-color:#007fa5}
      .loader-text{
        margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.2em;font-family:system-ui,sans-serif;
      }
      html.dark  .loader-text{color:rgba(255,255,255,.4)}
      html.light .loader-text{color:rgba(10,50,70,.45)}
      @keyframes spin{to{transform:rotate(360deg)}}
      #app-loader.hidden{opacity:0;pointer-events:none}
    </style>
  </head>

  <body>
    <div id="app-loader">
      <div class="loader-logo"></div>
      <div class="loader-ring"></div>
      <div class="loader-text">RS TOSS BOOK</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.__hideLoader=function(){
        var el=document.getElementById('app-loader');
        if(el){el.classList.add('hidden');setTimeout(function(){el.remove()},350);}
      };
    </script>
  </body>
</html>
